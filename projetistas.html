<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GestãoQ — Projetistas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#0d1117; --panel:#13191f; --border:#1e2832;
    --accent:#f0a500; --accent2:#e07b00;
    --text:#e8edf2; --muted:#6b7a8d;
    --danger:#e05252; --success:#3dba7e; --info:#4a9edd;
  }
  html,body { min-height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; }
  body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px); background-size:48px 48px; opacity:.25; pointer-events:none; z-index:0; }

  .topbar { position:sticky; top:0; z-index:100; background:rgba(13,17,23,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 32px; height:60px; gap:32px; }
  .topbar__logo { font-family:'DM Serif Display',serif; font-size:18px; color:var(--text); text-decoration:none; margin-right:16px; }
  .topbar__logo span { color:var(--accent); }
  .topbar__nav { display:flex; align-items:center; gap:4px; flex:1; }
  .nav-link { padding:6px 14px; border-radius:6px; font-size:14px; color:var(--muted); text-decoration:none; transition:color .2s,background .2s; }
  .nav-link:hover { color:var(--text); background:var(--panel); }
  .nav-link.active { color:var(--accent); background:rgba(240,165,0,.08); }
  .topbar__right { display:flex; align-items:center; gap:16px; margin-left:auto; }
  .topbar__user { display:flex; align-items:center; gap:10px; font-size:13px; }
  .avatar { width:32px; height:32px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; color:#0d1117; }
  .badge-perfil { font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:.6px; background:rgba(240,165,0,.12); color:var(--accent); border:1px solid rgba(240,165,0,.2); border-radius:4px; padding:2px 7px; }
  .btn-sair { padding:5px 12px; background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:6px; font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; transition:all .2s; }
  .btn-sair:hover { color:var(--danger); border-color:var(--danger); }

  .page { position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:28px 32px 64px; }
  .page-header { margin-bottom:24px; }
  .page-header h1 { font-family:'DM Serif Display',serif; font-size:28px; letter-spacing:-.5px; margin-bottom:4px; }
  .page-header p { color:var(--muted); font-size:14px; }

  .page-layout { display:grid; grid-template-columns:1fr 280px; gap:24px; align-items:start; }

  /* GRID DE CARDS */
  .section-label { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin-bottom:14px; }
  .projetistas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }

  .projetista-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px; cursor:pointer; transition:border-color .2s,transform .15s; text-decoration:none; color:inherit; display:block; animation:fadeUp .3s ease both; }
  .projetista-card:hover { border-color:rgba(240,165,0,.3); transform:translateY(-2px); }

  .card-top { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .card-avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'DM Serif Display',serif; font-size:18px; flex-shrink:0; }
  .card-nome { font-size:15px; font-weight:500; margin-bottom:3px; }
  .card-equipe { font-size:12px; color:var(--muted); }
  .rank-badge { margin-left:auto; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; flex-shrink:0; }
  .rank--1 { background:rgba(224,82,82,.15);  color:var(--danger); }
  .rank--2 { background:rgba(240,165,0,.12);  color:var(--accent); }
  .rank--3 { background:rgba(74,158,221,.12); color:var(--info); }
  .rank--n { background:rgba(255,255,255,.05); color:var(--muted); }

  .card-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:16px; }
  .stat-mini { background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:8px; padding:10px 12px; min-width:0; }
  .stat-mini__val { font-family:'DM Serif Display',serif; font-size:20px; line-height:1; margin-bottom:3px; }
  .stat-mini__label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }

  .card-faixa { display:flex; align-items:center; gap:8px; }
  .faixa-bar { flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
  .faixa-bar__fill { height:100%; border-radius:3px; transition:width .6s ease; }
  .faixa-tag { font-size:10px; font-weight:500; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .tag--otimo   { color:var(--success); background:rgba(61,186,126,.1); }
  .tag--regular { color:var(--info);    background:rgba(74,158,221,.1); }
  .tag--atencao { color:var(--accent);  background:rgba(240,165,0,.1); }
  .tag--critico { color:var(--danger);  background:rgba(224,82,82,.1); }

  /* SIDEBAR */
  .admin-sidebar { background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; position:sticky; top:80px; }
  .sidebar-header { padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .sidebar-header__title { font-size:13px; font-weight:500; }
  .sidebar-header__sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .sidebar-header__badge { font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:.5px; background:rgba(240,165,0,.12); color:var(--accent); border:1px solid rgba(240,165,0,.2); border-radius:4px; padding:2px 7px; }
  .sidebar-search { padding:10px 12px; border-bottom:1px solid var(--border); }
  .sidebar-search input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:7px 10px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:12px; outline:none; transition:border-color .2s; }
  .sidebar-search input:focus { border-color:var(--accent); }
  .sidebar-search input::placeholder { color:var(--muted); }
  .sidebar-list { max-height:340px; overflow-y:auto; padding:6px; }
  .sidebar-list::-webkit-scrollbar { width:3px; }
  .sidebar-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .sidebar-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px; transition:background .15s; }
  .sidebar-item:hover { background:rgba(255,255,255,.03); }
  .sidebar-item:hover .sidebar-item__del { opacity:1; }
  .sidebar-avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; flex-shrink:0; }
  .sidebar-item__nome { font-size:13px; color:var(--text); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-item__del { opacity:0; width:22px; height:22px; background:transparent; border:none; border-radius:5px; cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; transition:all .15s; flex-shrink:0; }
  .sidebar-item__del:hover { background:rgba(224,82,82,.12); color:var(--danger); }
  .sidebar-add { padding:12px; border-top:1px solid var(--border); }
  .btn-add-full { width:100%; padding:9px; background:rgba(240,165,0,.1); color:var(--accent); border:1px solid rgba(240,165,0,.2); border-radius:8px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:background .2s; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-add-full:hover { background:rgba(240,165,0,.18); }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; }
  .modal-overlay.visible { opacity:1; pointer-events:all; }
  .modal { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px; width:100%; max-width:400px; transform:translateY(14px); transition:transform .2s; }
  .modal-overlay.visible .modal { transform:translateY(0); }
  .modal__title { font-family:'DM Serif Display',serif; font-size:20px; margin-bottom:4px; }
  .modal__sub { font-size:13px; color:var(--muted); margin-bottom:22px; }
  .mfield { margin-bottom:14px; }
  .mfield label { display:block; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin-bottom:7px; }
  .mfield input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; transition:border-color .2s; }
  .mfield input:focus { border-color:var(--accent); }
  .mfield input::placeholder { color:var(--muted); }
  .mfield input.err { border-color:var(--danger); }
  .modal__actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
  .btn-cancel { padding:8px 16px; background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:8px; font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; }
  .btn-cancel:hover { color:var(--text); border-color:var(--muted); }
  .btn-confirm { padding:8px 18px; background:var(--accent); color:#0d1117; border:none; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; }
  .btn-confirm:hover { background:var(--accent2); }

  .toast { position:fixed; bottom:24px; right:24px; z-index:400; background:var(--success); color:#0d1117; padding:11px 18px; border-radius:8px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:8px; transform:translateY(60px); opacity:0; transition:all .25s; pointer-events:none; }
  .toast.visible { transform:translateY(0); opacity:1; }

  .empty-grid { background:var(--panel); border:1px dashed var(--border); border-radius:12px; padding:48px 24px; text-align:center; color:var(--muted); grid-column:1/-1; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @media(max-width:1024px){ .page-layout{grid-template-columns:1fr;} .admin-sidebar{position:static;} }
  @media(max-width:768px){ .page{padding:20px 16px 48px;} .topbar{padding:0 16px;gap:16px;} }
</style>
</head>
<body>

<header class="topbar">
  <a href="dashboard.html" class="topbar__logo">Gestão<span>Q</span></a>
  <nav class="topbar__nav">
    <a href="dashboard.html"   class="nav-link">Dashboard</a>
    <a href="projetos.html"    class="nav-link">Projetos</a>
    <a href="projetistas.html" class="nav-link active">Projetistas</a>
    <a href="categorias.html"  class="nav-link">Classificação de erros</a>
    <a href="usuarios.html"    class="nav-link">Usuários</a>
  </nav>
  <div class="topbar__right">
    <div class="topbar__user">
      <span class="badge-perfil" id="badgePerfil">—</span>
      <span style="color:var(--text);font-size:13px;" id="nomeUsuario">—</span>
      <div class="avatar" id="avatarUsuario">—</div>
    </div>
    <button class="btn-sair" onclick="Sessao.encerrar()">Sair</button>
  </div>
</header>

<main class="page">

  <div class="page-header">
    <h1>Projetistas</h1>
    <p>Visão geral de desempenho · Erros por projeto</p>
  </div>

  <div style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:14px;">Desempenho geral</div>

  <div class="page-layout">
    <div class="projetistas-grid" id="grid">
      <div class="empty-grid">Carregando…</div>
    </div>

    <!-- SIDEBAR ADMIN -->
    <aside class="admin-sidebar" id="adminSidebar" style="display:none;">
      <div class="sidebar-header">
        <div>
          <div class="sidebar-header__title">Projetistas</div>
          <div class="sidebar-header__sub">Cadastro e remoção</div>
        </div>
        <span class="sidebar-header__badge">Admin</span>
      </div>
      <div class="sidebar-search">
        <input type="text" placeholder="Buscar projetista…" oninput="filtrarSidebar(this.value)">
      </div>
      <div class="sidebar-list" id="sidebarList"></div>
      <div class="sidebar-add">
        <button class="btn-add-full" onclick="abrirModal()">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Cadastrar projetista
        </button>
      </div>
    </aside>
  </div>
</main>

<!-- MODAL CADASTRO -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal">
    <div class="modal__title">Novo projetista</div>
    <div class="modal__sub">Registro de referência — sem acesso ao sistema</div>
    <div class="mfield">
      <label>Nome completo *</label>
      <input type="text" id="mNome" placeholder="Ex: Carlos Mendes" />
    </div>
    <div class="modal__actions">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-confirm" onclick="cadastrarProjetista()">Cadastrar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
  <span id="toastMsg">Salvo!</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  // ── PROTEÇÃO DE ROTA ─────────────────────────────────────
  const usuario = Sessao.exigir();
  document.getElementById('nomeUsuario').textContent  = usuario.usuario;
  document.getElementById('badgePerfil').textContent  = usuario.perfil;
  document.getElementById('avatarUsuario').textContent =
    usuario.nome.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();

  // Sidebar só para admin
  if (usuario.perfil === 'admin') {
    document.getElementById('adminSidebar').style.display = '';
  }

  // ── CORES ────────────────────────────────────────────────
  const PALETA = [
    { cor:'#e05252', bg:'rgba(224,82,82,.15)' },
    { cor:'#f0a500', bg:'rgba(240,165,0,.15)' },
    { cor:'#4a9edd', bg:'rgba(74,158,221,.15)' },
    { cor:'#3dba7e', bg:'rgba(61,186,126,.15)' },
    { cor:'#b07ddd', bg:'rgba(176,125,221,.15)' },
    { cor:'#f07830', bg:'rgba(240,120,48,.15)' },
  ];

  function paleta(idx) { return PALETA[idx % PALETA.length]; }
  function iniciais(nome) { return nome.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase(); }

  // ── CLASSIFICAÇÃO ────────────────────────────────────────
  function classificar(ratio) {
    if (ratio <= 5.0) return { tag:'Crítico', cls:'tag--critico', cor:'#e05252' };
    if (ratio <= 6.5) return { tag:'Atenção', cls:'tag--atencao', cor:'#f0a500' };
    if (ratio <= 8.0) return { tag:'Regular', cls:'tag--regular', cor:'#4a9edd' };
    return                  { tag:'Ótimo',   cls:'tag--otimo',   cor:'#3dba7e' };
  }

  // ── CARREGAR DADOS ───────────────────────────────────────
  let todosProjetistas = [];

  async function carregarDados() {
    const { data, error } = await db
      .from('vw_erros_por_projetista')
      .select('*')
      .order('total_erros', { ascending: false });

    if (error) {
      console.error(error);
      document.getElementById('grid').innerHTML =
        '<div class="empty-grid">Erro ao carregar dados.</div>';
      return;
    }

    todosProjetistas = (data || []).map((d, i) => ({
      ...d,
      idx: i,
      rank: i + 1,
    }));

    renderGrid();
    if (usuario.perfil === 'admin') renderSidebar();
  }

  // ── RENDER GRID ──────────────────────────────────────────
  function renderGrid() {
    const grid = document.getElementById('grid');
    if (!todosProjetistas.length) {
      grid.innerHTML = '<div class="empty-grid">Nenhum projetista cadastrado ainda.</div>';
      return;
    }

    grid.innerHTML = todosProjetistas.map((d) => {
      const ratio  = parseFloat(d.erros_por_projeto) || 0;
      const cl     = classificar(ratio);
      const pct    = Math.min(100, Math.round((ratio / 10) * 100));
      const p      = paleta(d.idx);
      const rc     = d.rank <= 3 ? `rank--${d.rank}` : 'rank--n';

      return `
        <a class="projetista-card" href="projetista-perfil.html" onclick="selecionarProjetista('${d.projetista_id}')">
          <div class="card-top">
            <div class="card-avatar" style="background:${p.bg};color:${p.cor};">${iniciais(d.projetista_nome)}</div>
            <div>
              <div class="card-nome">${d.projetista_nome}</div>
              <div class="card-equipe">${d.equipe || '—'}</div>
            </div>
            <div class="rank-badge ${rc}">${d.rank}º</div>
          </div>
          <div class="card-stats">
            <div class="stat-mini">
              <div class="stat-mini__val">${d.total_erros || 0}</div>
              <div class="stat-mini__label">Erros</div>
            </div>
            <div class="stat-mini">
              <div class="stat-mini__val">${d.total_projetos || 0}</div>
              <div class="stat-mini__label">Projetos</div>
            </div>
            <div class="stat-mini">
              <div class="stat-mini__val" style="color:${cl.cor};">${ratio.toFixed(1)}</div>
              <div class="stat-mini__label">Erros / proj</div>
            </div>
            <div class="stat-mini">
              <div class="stat-mini__val" style="color:${(d.nao_conformes||0)>0?'var(--danger)':'var(--success)'};">${d.nao_conformes || 0}</div>
              <div class="stat-mini__label">Não conforme</div>
            </div>
          </div>
          <div class="card-faixa">
            <div class="faixa-bar">
              <div class="faixa-bar__fill" style="width:${pct}%;background:${cl.cor};"></div>
            </div>
            <span class="faixa-tag ${cl.cls}">${cl.tag}</span>
          </div>
        </a>`;
    }).join('');
  }

  function selecionarProjetista(id) {
    localStorage.setItem('gq_projetista_id', id);
  }

  // ── SIDEBAR ──────────────────────────────────────────────
  let listaSidebar = [];

  async function renderSidebar(filtro = '') {
    if (!listaSidebar.length) {
      const { data } = await db
        .from('projetistas')
        .select('id, nome')
        .eq('ativo', true)
        .order('nome');
      listaSidebar = data || [];
    }

    const filtrados = filtro
      ? listaSidebar.filter(p => p.nome.toLowerCase().includes(filtro.toLowerCase()))
      : listaSidebar;

    const lista = document.getElementById('sidebarList');
    if (!filtrados.length) {
      lista.innerHTML = '<div style="padding:16px;text-align:center;font-size:12px;color:var(--muted);">Nenhum encontrado</div>';
      return;
    }

    lista.innerHTML = filtrados.map((p, i) => {
      const pal = paleta(i);
      return `
        <div class="sidebar-item" id="si-${p.id}">
          <div class="sidebar-avatar" style="background:${pal.bg};color:${pal.cor};">${iniciais(p.nome)}</div>
          <span class="sidebar-item__nome">${p.nome}</span>
          <button class="sidebar-item__del" onclick="removerProjetista('${p.id}')" title="Remover">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>`;
    }).join('');
  }

  function filtrarSidebar(v) { renderSidebar(v); }

  // ── CRUD PROJETISTAS ─────────────────────────────────────
  function abrirModal() {
    document.getElementById('mNome').value = '';
    document.getElementById('mNome').classList.remove('err');
    document.getElementById('modalOverlay').classList.add('visible');
    setTimeout(() => document.getElementById('mNome').focus(), 180);
  }

  function fecharModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').classList.remove('visible');
  }

  async function cadastrarProjetista() {
    const nome = document.getElementById('mNome').value.trim();
    if (!nome) { document.getElementById('mNome').classList.add('err'); return; }
    document.getElementById('mNome').classList.remove('err');

    const { error } = await db.from('projetistas').insert([{ nome, ativo: true }]);
    if (error) { toast('Erro ao cadastrar. Tente novamente.'); return; }

    document.getElementById('modalOverlay').classList.remove('visible');
    listaSidebar = []; // forçar reload
    await carregarDados();
    renderSidebar();
    mostrarToast('Projetista cadastrado!');
  }

  async function removerProjetista(id) {
    const { error } = await db
      .from('projetistas')
      .update({ ativo: false })
      .eq('id', id);

    if (error) { mostrarToast('Erro ao remover.'); return; }

    const el = document.getElementById('si-' + id);
    if (el) { el.style.opacity='0'; el.style.transition='opacity .15s'; }
    setTimeout(async () => {
      listaSidebar = listaSidebar.filter(p => p.id !== id);
      renderSidebar();
      await carregarDados();
      mostrarToast('Projetista removido.');
    }, 150);
  }

  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 2500);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('visible');
  });

  // ── INIT ─────────────────────────────────────────────────
  carregarDados();
</script>

</body>
</html>
