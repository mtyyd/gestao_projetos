<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GestãoQ — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d1117;
    --panel:    #13191f;
    --border:   #1e2832;
    --accent:   #f0a500;
    --accent2:  #e07b00;
    --text:     #e8edf2;
    --muted:    #6b7a8d;
    --danger:   #e05252;
    --input-bg: #0d1117;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.4;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    top: -40%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(240,165,0,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .layout {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 520px;
  }

  /* Painel esquerdo */
  .brand-panel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 48px 56px 80px;
    border-right: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .brand-panel__deco {
    position: absolute;
    bottom: -60px;
    left: -60px;
    width: 400px;
    height: 400px;
    border: 1px solid var(--border);
    border-radius: 50%;
    opacity: 0.5;
  }
  .brand-panel__deco::after {
    content: '';
    position: absolute;
    inset: 40px;
    border: 1px solid var(--border);
    border-radius: 50%;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .logo__icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo__name {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .logo__name span { color: var(--accent); }

  .brand-content {
    margin-top: auto;
    margin-bottom: auto;
  }

  .brand-content h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(42px, 5vw, 64px);
    line-height: 1.05;
    letter-spacing: -1.5px;
    color: var(--text);
  }

  .brand-content h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .brand-footer {
    font-size: 12px;
    color: var(--muted);
  }

  /* Painel direito */
  .form-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 56px 48px;
    background: var(--panel);
  }

  .form-header {
    margin-bottom: 40px;
  }

  .form-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .form-header p {
    color: var(--muted);
    font-size: 14px;
  }

  .field { margin-bottom: 20px; }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .btn:hover { background: var(--accent2); }
  .btn:active { transform: scale(0.99); }
  .btn.loading .btn-text { opacity: 0; }
  .btn.loading .btn-spinner { opacity: 1; }

  .btn-spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(13,17,23,0.3);
    border-top-color: #0d1117;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: rgba(224,82,82,0.1);
    border: 1px solid rgba(224,82,82,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--danger);
    margin-bottom: 20px;
    display: none;
  }

  .error-msg.visible { display: block; }

  .form-footer {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  .form-panel > * {
    animation: fadeUp 0.4s ease both;
  }
  .form-panel > *:nth-child(1) { animation-delay: 0.05s; }
  .form-panel > *:nth-child(2) { animation-delay: 0.10s; }
  .form-panel > *:nth-child(3) { animation-delay: 0.15s; }
  .form-panel > *:nth-child(4) { animation-delay: 0.20s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .brand-panel { display: none; }
    .form-panel { padding: 40px 28px; }
  }
</style>
</head>
<body>

<div class="layout">

  <div class="brand-panel">
    <div class="brand-panel__deco"></div>

<div class="brand-content">
      <h1>Controle de<br><em>Qualidade</em></h1>
    </div>

    <div class="brand-footer">
      Sistema interno de gestão da qualidade · Redes de distribuição elétrica
    </div>
  </div>

  <div class="form-panel">
    <div class="form-header">
      <h2>Bem-vindo de volta</h2>
      <p>Entre com suas credenciais para acessar o sistema</p>
    </div>

    <div class="error-msg" id="errorMsg">
      E-mail ou senha incorretos. Tente novamente.
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" placeholder="seu usuário" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••" autocomplete="current-password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required />
      </div>

      <button type="submit" class="btn" id="loginBtn">
        <span class="btn-text">Entrar no sistema</span>
        <span class="btn-spinner"><div class="spinner"></div></span>
      </button>
    </form>

    <div class="form-footer">
      Acesso restrito a membros da equipe.<br>
      Problemas? Fale com Kauã Soares.
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const btn  = document.getElementById('loginBtn');
  const err  = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('visible');

    const usuario = document.getElementById('usuario').value.trim();
    const senha   = document.getElementById('senha').value;

    if (!/^\d{6}$/.test(senha)) {
      err.textContent = 'A senha deve conter exatamente 6 números.';
      err.classList.add('visible');
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;

    // ── CONEXÃO SUPABASE ──────────────────────────────────
    // const { data, error } = await supabase.auth.signInWithPassword({
    //   email: usuario,      // ou buscar email pelo username na tabela usuarios
    //   password: senha,
    // })
    // if (error) {
    //   err.textContent = 'Usuário ou senha incorretos. Tente novamente.';
    //   err.classList.add('visible');
    //   btn.classList.remove('loading');
    //   btn.disabled = false;
    //   return;
    // }
    // window.location.href = '/dashboard.html'
    // ─────────────────────────────────────────────────────

    await new Promise(r => setTimeout(r, 1400));
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
