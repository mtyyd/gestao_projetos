<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GestãoQ — Projetos</title>
<script>
// Verificação antecipada — redireciona antes de renderizar
(function(){
  try {
    var s = localStorage.getItem('gq_usuario');
    if (!s || !JSON.parse(s).id) { window.location.replace('login.html'); }
  } catch(e) { window.location.replace('login.html'); }
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#0d1117; --panel:#13191f; --border:#1e2832;
    --accent:#f0a500; --accent2:#e07b00;
    --text:#e8edf2; --muted:#6b7a8d;
    --danger:#e05252; --success:#3dba7e; --info:#4a9edd;
  }
  html,body { min-height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; }
  body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px); background-size:48px 48px; opacity:.25; pointer-events:none; z-index:0; }

  .topbar { position:sticky; top:0; z-index:100; background:rgba(13,17,23,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 32px; height:60px; gap:32px; }
  .topbar__logo { font-family:'DM Serif Display',serif; font-size:18px; color:var(--text); text-decoration:none; margin-right:16px; }
  .topbar__logo span { color:var(--accent); }
  .topbar__nav { display:flex; align-items:center; gap:4px; flex:1; }
  .nav-link { padding:6px 14px; border-radius:6px; font-size:14px; color:var(--muted); text-decoration:none; transition:color .2s,background .2s; }
  .nav-link:hover { color:var(--text); background:var(--panel); }
  .nav-link.active { color:var(--accent); background:rgba(240,165,0,.08); }
  .topbar__right { display:flex; align-items:center; gap:16px; margin-left:auto; }
  .topbar__user { display:flex; align-items:center; gap:10px; font-size:13px; }
  .avatar { width:32px; height:32px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; color:#0d1117; }
  .badge-perfil { font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:.6px; background:rgba(240,165,0,.12); color:var(--accent); border:1px solid rgba(240,165,0,.2); border-radius:4px; padding:2px 7px; }
  .btn-sair { padding:5px 12px; background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:6px; font-family:'DM Sans',sans-serif; font-size:12px; cursor:pointer; transition:all .2s; }
  .btn-sair:hover { color:var(--danger); border-color:var(--danger); }

  .page { position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:32px 32px 64px; }
  .page-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:28px; gap:16px; }
  .page-header h1 { font-family:'DM Serif Display',serif; font-size:28px; letter-spacing:-.5px; margin-bottom:4px; }
  .page-header p { color:var(--muted); font-size:14px; }

  .btn-primary { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; background:var(--accent); color:#0d1117; border:none; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; text-decoration:none; transition:background .2s; white-space:nowrap; }
  .btn-primary:hover { background:var(--accent2); }

  .filters { display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .search-wrap { position:relative; flex:1; min-width:200px; }
  .search-wrap svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .search-wrap input { width:100%; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:9px 12px 9px 36px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; transition:border-color .2s; }
  .search-wrap input:focus { border-color:var(--accent); }
  .search-wrap input::placeholder { color:var(--muted); }
  .filter-select { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:9px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; cursor:pointer; }
  .filter-select:focus { border-color:var(--accent); }
  .filter-select option { background:var(--panel); }

  .table-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead th { padding:11px 20px; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); text-align:left; background:rgba(255,255,255,.02); border-bottom:1px solid var(--border); }
  tbody td { padding:15px 20px; font-size:14px; border-bottom:1px solid rgba(30,40,50,.6); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr { transition:background .15s; cursor:pointer; }
  tbody tr:hover { background:rgba(255,255,255,.02); }

  .status-badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .status-badge::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; }
  .status--aprovado  { color:var(--success); background:rgba(61,186,126,.1); }
  .status--ressalvas { color:var(--accent);  background:rgba(240,165,0,.1); }
  .status--reprovado { color:var(--danger);  background:rgba(224,82,82,.1); }
  .status--pendente  { color:var(--muted);   background:rgba(107,122,141,.1); }

  .tipo-badge { font-size:11px; font-weight:500; padding:3px 9px; border-radius:4px; background:rgba(255,255,255,.05); color:var(--muted); border:1px solid var(--border); }

  .table-footer { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-top:1px solid var(--border); font-size:13px; color:var(--muted); }

  .empty-row td { text-align:center; padding:48px 20px; color:var(--muted); font-size:14px; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @media(max-width:768px){ .page{padding:20px 16px 48px;} .topbar{padding:0 16px;gap:16px;} }
</style>
</head>
<body>

<header class="topbar">
  <a href="dashboard.html" class="topbar__logo">Gestão<span>Q</span></a>
  <nav class="topbar__nav">
    <a href="dashboard.html"   class="nav-link">Dashboard</a>
    <a href="projetos.html"    class="nav-link active">Projetos</a>
    <a href="projetistas.html" class="nav-link">Projetistas</a>
    <a href="categorias.html"  class="nav-link">Classificação de erros</a>
    <a href="usuarios.html"    class="nav-link">Usuários</a>
  </nav>
  <div class="topbar__right">
    <div class="topbar__user">
      <span class="badge-perfil" id="badgePerfil">—</span>
      <span style="color:var(--text);font-size:13px;" id="nomeUsuario">—</span>
      <div class="avatar" id="avatarUsuario">—</div>
    </div>
    <button class="btn-sair" onclick="Sessao.encerrar()">Sair</button>
  </div>
</header>

<main class="page">

  <div class="page-header">
    <div>
      <h1>Projetos</h1>
      <p>Gerencie e acompanhe todos os comissionamentos cadastrados</p>
    </div>
    <a href="projetos-novo.html" class="btn-primary" id="btnNovo">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      Novo Comissionamento
    </a>
  </div>

  <div class="filters">
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Buscar por NS ou cidade…" id="searchInput" oninput="filtrar()">
    </div>
    <select class="filter-select" id="filterStatus" onchange="filtrar()">
      <option value="">Todos os resultados</option>
      <option value="aprovado">Aprovado</option>
      <option value="ressalvas">Aprovado com ressalvas</option>
      <option value="reprovado">Reprovado</option>
      <option value="pendente">Pendente</option>
    </select>
    <select class="filter-select" id="filterCliente" onchange="filtrar()">
      <option value="">Todos os clientes</option>
      <option value="externo">Cliente Externo</option>
      <option value="interno">Cliente Interno</option>
    </select>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Nota de Serviço</th>
          <th>Cidade</th>
          <th>Projetista</th>
          <th>Comissionador</th>
          <th>Cliente</th>
          <th>Levantamento</th>
          <th>Resultado</th>
          <th>Erros</th>
        </tr>
      </thead>
      <tbody id="tabelaProjetos">
        <tr class="empty-row"><td colspan="8">Carregando…</td></tr>
      </tbody>
    </table>
    <div class="table-footer">
      <span id="countLabel">—</span>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  // ── PROTEÇÃO DE ROTA ─────────────────────────────────────
  const usuario = Sessao.exigir();
  document.getElementById('nomeUsuario').textContent  = usuario.usuario;
  document.getElementById('badgePerfil').textContent  = usuario.perfil;
  document.getElementById('avatarUsuario').textContent =
    usuario.nome.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();

  // Leitor não vê botão de novo comissionamento
  if (usuario.perfil === 'leitor') {
    document.getElementById('btnNovo').style.display = 'none';
  }

  // ── DADOS ────────────────────────────────────────────────
  let todosProjetos = [];

  async function carregarProjetos() {
    const { data, error } = await db
      .from('projetos')
      .select(`
        id, ns, cidade, tipo_cliente, tipo_atendimento,
        data_levantamento, resultado, desconto,
        projetistas ( nome ),
        usuarios!projetos_criado_por_fkey ( nome ),
        erros ( id )
      `)
      .order('criado_em', { ascending: false });

    if (error) {
      console.error(error);
      document.getElementById('tabelaProjetos').innerHTML =
        '<tr class="empty-row"><td colspan="8">Erro ao carregar projetos.</td></tr>';
      return;
    }

    todosProjetos = (data || []).map(p => ({
      ...p,
      projetistaNome:   p.projetistas?.nome || '—',
      comissionadorNome: p.usuarios?.nome || '—',
      totalErros:       p.erros?.length || 0,
      resultado:        p.resultado || 'pendente',
    }));

    renderTabela(todosProjetos);
  }

  // ── RENDER ───────────────────────────────────────────────
  const statusLabels = {
    aprovado:  'Aprovado',
    ressalvas: 'Aprovado com ressalvas',
    reprovado: 'Reprovado',
    pendente:  'Pendente',
  };
  const clienteLabels = { externo:'Cliente Externo', interno:'Cliente Interno' };

  function renderTabela(lista) {
    const tb = document.getElementById('tabelaProjetos');
    if (lista.length === 0) {
      tb.innerHTML = '<tr class="empty-row"><td colspan="8">Nenhum projeto encontrado.</td></tr>';
      document.getElementById('countLabel').textContent = '0 projetos';
      return;
    }

    tb.innerHTML = lista.map(p => {
      const data = p.data_levantamento
        ? new Date(p.data_levantamento + 'T00:00:00').toLocaleDateString('pt-BR')
        : '—';

      const corErro = p.totalErros === 0
        ? 'var(--success)'
        : p.resultado === 'reprovado'
          ? 'var(--danger)'
          : 'var(--accent)';

      return `<tr onclick="abrirProjeto('${p.id}','${p.ns}','${p.cidade}','${p.projetistaNome}','${p.tipo_atendimento||''}','${p.resultado}','${p.desconto}')">
        <td style="color:var(--muted);font-weight:500;">${p.ns}</td>
        <td>${p.cidade}</td>
        <td style="font-size:13px;">${p.projetistaNome}</td>
        <td style="font-size:13px;color:var(--muted);">${p.comissionadorNome}</td>
        <td><span class="tipo-badge">${clienteLabels[p.tipo_cliente] || p.tipo_cliente}</span></td>
        <td style="color:var(--muted);font-size:13px;">${data}</td>
        <td><span class="status-badge status--${p.resultado}">${statusLabels[p.resultado]}</span></td>
        <td style="color:${corErro};font-weight:500;">${p.totalErros}</td>
      </tr>`;
    }).join('');

    document.getElementById('countLabel').textContent =
      lista.length + (lista.length === 1 ? ' projeto' : ' projetos');
  }

  // ── FILTRO ───────────────────────────────────────────────
  function filtrar() {
    const busca   = document.getElementById('searchInput').value.toLowerCase();
    const status  = document.getElementById('filterStatus').value;
    const cliente = document.getElementById('filterCliente').value;

    const filtrado = todosProjetos.filter(p => {
      const okBusca   = !busca   || p.ns.toLowerCase().includes(busca) || p.cidade.toLowerCase().includes(busca) || p.projetistaNome.toLowerCase().includes(busca);
      const okStatus  = !status  || p.resultado === status;
      const okCliente = !cliente || p.tipo_cliente === cliente;
      return okBusca && okStatus && okCliente;
    });

    renderTabela(filtrado);
  }

  // ── ABRIR PROJETO ─────────────────────────────────────────
  function abrirProjeto(id, ns, cidade, projetista, atendimento, resultado, desconto) {
    localStorage.setItem('gestaoq_comissionamento', JSON.stringify({
      id, ns, cidade, projetista, atendimento
    }));
    localStorage.setItem('gestaoq_abrir_resumo', resultado ? '1' : '0');
    window.location.href = 'projeto-erros.html';
  }

  // ── INIT ─────────────────────────────────────────────────
  carregarProjetos();
</script>

</body>
</html>
